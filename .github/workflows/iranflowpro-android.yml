name: IranFlowPro Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle 8.10.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip
          echo "$PWD/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Build IranFlowPro
        run: gradle -p IranFlowPro assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: IranFlowPro-debug-apk
          path: IranFlowPro/app/build/outputs/apk/debug/*.apk
